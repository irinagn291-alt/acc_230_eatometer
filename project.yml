name: Eatometer
options:
  bundleIdPrefix: com.eatometer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
packages:
  Collections:
    url: https://github.com/apple/swift-collections.git
    from: "1.1.4"
  Algorithms:
    url: https://github.com/apple/swift-algorithms.git
    from: "1.2.1"
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    revision: 7fdd403089757be2ce6991b287c7bef612c8bd04
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Eatometer:
    type: application
    platform: iOS
    sources:
      - path: Eatometer
    dependencies:
      - package: Collections
        product: OrderedCollections
      - package: Algorithms
        product: Algorithms
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eatometer.meter
        PRODUCT_NAME: Eatometer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Eatometer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIImageName: etm_Splash
        INFOPLIST_KEY_UILaunchScreen_UIColorName: etm_background
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSCameraUsageDescription: Eatometer reads barcodes to take a measurement from a package.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ENABLE_TESTABILITY: YES
  EatometerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EatometerTests
    dependencies:
      - target: Eatometer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.eatometer.meter.tests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.2"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Eatometer.app/Eatometer"
schemes:
  Eatometer:
    build:
      targets:
        Eatometer: all
        EatometerTests: [test]
    test:
      targets:
        - EatometerTests
